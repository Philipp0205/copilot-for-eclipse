name: Publish P2 update site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: com.microsoft.copilot.eclipse.core/copilot-agent/package-lock.json

      - name: Install Copilot agent
        working-directory: com.microsoft.copilot.eclipse.core/copilot-agent
        run: npm ci --force

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build P2 repository
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
        with:
          run: ./mvnw clean verify --batch-mode --no-transfer-progress

      - name: Prepare GitHub Pages site
        run: |
          test -d com.microsoft.copilot.eclipse.repository/target/repository
          cp .github/pages/index.html com.microsoft.copilot.eclipse.repository/target/repository/index.html
          touch com.microsoft.copilot.eclipse.repository/target/repository/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload P2 repository
        uses: actions/upload-pages-artifact@v5
        with:
          path: com.microsoft.copilot.eclipse.repository/target/repository
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
